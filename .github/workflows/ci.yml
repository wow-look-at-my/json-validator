name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level set, so this repeats
    # them and adds deployments: write -- go-toolchain registers a GitHub
    # Deployment for every buildhost publish, and that registration is part of
    # publishing rather than something a repo can decline. Without it the
    # publish step fails the build.
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1

  # Exercise the composite action end-to-end on a real runner: this runs the
  # download-prebuilt path and validates known-good fixtures (exit 0).
  action-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          files: 'testdata/valid.json testdata/valid.jsonc'
          schema: 'testdata/schema.json'
