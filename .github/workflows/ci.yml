name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Job permissions replace the workflow set; the publish needs deployments and artifact-metadata.
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@master

  # Runs the composite action's download path on known-good fixtures.
  action-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          files: 'testdata/valid.json testdata/valid.jsonc'
          schema: 'testdata/schema.json'
