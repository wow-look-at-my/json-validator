name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level set, so this repeats the
    # four this job already had and adds the two the buildhost publish needs:
    # go-toolchain registers a GitHub Deployment for the publish and records
    # each artifact on the org's linked-artifacts page. Both are part of
    # publishing rather than something a repo can decline -- without them the
    # publish step fails the build.
    permissions:
      id-token: write
      contents: write
      actions: read
      checks: read
      deployments: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1

  # Exercise the composite action end-to-end on a real runner: this runs the
  # download-prebuilt path and validates known-good fixtures (exit 0).
  action-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          files: 'testdata/valid.json testdata/valid.jsonc'
          schema: 'testdata/schema.json'
