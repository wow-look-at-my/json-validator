name: 'Validate JSON'
description: 'Build (with caching) and run json-validator to check JSON/JSONC files against JSON Schema'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  files:
    description: 'Space-separated files or glob patterns to validate. When omitted, auto-discovers all *.json and *.jsonc files containing a $schema field.'
    required: false
    default: ''
  schema:
    description: 'Path or URL to JSON Schema (overrides $schema in documents)'
    required: false
    default: ''
  args:
    description: 'Additional CLI arguments (e.g. "--draft 7 --no-assert-format --json")'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: '${{ github.action_path }}/go.mod'
        cache: false

    - name: Compute cache key
      id: cache-key
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        RUN_STARTED=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          | jq -r '.run_started_at')
        HASH=$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" \
          "https://api.github.com/repos/${{ github.action_repository }}/commits?sha=${{ github.action_ref }}&until=${RUN_STARTED}&per_page=1" \
          | jq -r '.[0].sha')
        echo "hash=${HASH}" >> "$GITHUB_OUTPUT"

    - name: Cache json-validator binary
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/json-validator/bin
        key: json-validator-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.hash }}

    - name: Build json-validator
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        mkdir -p "${{ runner.tool_cache }}/json-validator/bin"
        go build -o "${{ runner.tool_cache }}/json-validator/bin/json-validator" .

    - name: Run json-validator
      shell: bash
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_SCHEMA: ${{ inputs.schema }}
        INPUT_ARGS: ${{ inputs.args }}
        VALIDATOR_BIN: ${{ runner.tool_cache }}/json-validator/bin/json-validator
      run: |
        CMD=("$VALIDATOR_BIN")
        if [ -n "$INPUT_SCHEMA" ]; then
          CMD+=(--schema "$INPUT_SCHEMA")
        fi
        # shellcheck disable=SC2086
        CMD+=(${INPUT_ARGS})

        if [ -n "$INPUT_FILES" ]; then
          # shellcheck disable=SC2086
          CMD+=(${INPUT_FILES})
        elif [ -z "$INPUT_ARGS" ]; then
          mapfile -t AUTO_FILES < <(
            find . -name .git -prune -o -name node_modules -prune -o \
              \( -name '*.json' -o -name '*.jsonc' \) -print0 |
            xargs -0 grep -l '"$schema"' 2>/dev/null || true
          )
          if [ ${#AUTO_FILES[@]} -eq 0 ]; then
            echo "No JSON/JSONC files with \$schema found"
            exit 0
          fi
          echo "Auto-discovered ${#AUTO_FILES[@]} file(s) with \$schema"
          CMD+=("${AUTO_FILES[@]}")
        fi

        "${CMD[@]}"
